# ---------------------------------------------------------------------------
# DocScan AI — Gradle configuration (see ARCHITECTURE.md §11)
# ---------------------------------------------------------------------------

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# JDK pinning.
# Gradle 8.10.2 supports JDK 8..22. The machine's default JAVA_HOME is JDK 25
# (not supported by Gradle 8.10.2) so we pin the detected JDK 21 instead.
# Remove this line if you build with Android Studio's bundled JBR (JDK 17/21).
# ---------------------------------------------------------------------------
org.gradle.java.home=C:/Program Files/Java/jdk-21

# ---------------------------------------------------------------------------
# AndroidX.
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
# SUBTASK H3b build fix: BuildConfig generation is enabled PER-MODULE in
# app/build.gradle.kts (`android.buildFeatures.buildConfig = true`). The former
# project-wide default `android.defaults.buildfeatures.buildconfig=false` was
# removed because it made a plain `gradlew.bat assembleDebug` FAIL (production
# code imports com.docscanai.BuildConfig) and the corpus lane had to paper over
# it with a command-line `-P` override. Never re-add that line.

# ---------------------------------------------------------------------------
# Kotlin.
# ---------------------------------------------------------------------------
kotlin.code.style=official
